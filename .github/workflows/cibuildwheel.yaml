name: Wheels

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
  push:

permissions:
  contents: read

jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-artifacts
          path: ${{ github.workspace }}/dist/*.tar.gz
    permissions:
      actions: write

  build_wheels:
    name: "Wheel on ${{ matrix.os }} (${{ matrix.cibw_platform }}-${{ matrix.arch }}) wheels"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            arch: x86_64
            cibw_platform: linux
          - name: Linux-arm
            os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: linux
          - name: Windows
            os: windows-2022
            arch: AMD64
            cibw_platform: windows
          - name: macOS-arm
            os: macos-15
            arch: arm64
            cibw_platform: macos
          - name: macOS-intel
            os: macos-15-intel
            arch: x86_64
            cibw_platform: macos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: "Building ${{ matrix.os }} (${{ matrix.arch }}) wheels"
        uses: pypa/cibuildwheel@f11181315571b24e4a3c67f1a828532793f2df55  # v4.3.2
        env:
          CIBW_PLATFORM: ${{ matrix.cibw_platform }}
          CIBW_SKIP: "*-musllinux*"
          CIBW_BUILD: "cp312-* cp314-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: uv
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_TEST_REQUIRES: pytest abi3audit
          CIBW_TEST_COMMAND: >
            python -c "import cell_tree2d; print(f'cell_tree2d v{cell_tree2d.__version__}')" &&
            python -m pytest --pyargs cell_tree2d &&
            abi3audit ${{ github.workspace }}/wheelhouse/*.whl --summary --assume-minimum-abi3 3.12 --verbose --strict

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/wheelhouse/*.whl
    permissions:
      actions: write

  publish-artifacts-pypi:
    needs: [make_sdist, build_wheels]
    name: "Publish to PyPI"
    runs-on: ubuntu-22.04
    if: success() && github.event_name == 'release'
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: pypi-artifacts*
        path: ${{ github.workspace }}/dist
        merge-multiple: true

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
    environment:
      name: release
      url: https://pypi.org/p/cell_tree2d
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
