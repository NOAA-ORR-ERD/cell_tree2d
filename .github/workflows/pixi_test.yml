name: Pixi Tests

on: [push, pull_request]

jobs:

  tests:
    name: Test ${{ matrix.environment }} on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
        environment: [ test312, test313, test314, test315 ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Pixi Environment
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
      with:
        cache: true
        environments: ${{ matrix.environment }}

    - name: Run Tests
      run: pixi run --environment ${{ matrix.environment }} test
