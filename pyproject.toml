[build-system]
requires = ["scikit-build-core", "cython", "numpy", "cython-cmake"]
build-backend = "scikit_build_core.build"

[project]
name = "cell-tree2d"
requires-python = ">=3.12"
description = "Python wrappers around Cell-Tree 2D spatial index"
readme = "README.rst"
license = "CC0-1.0"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Jay Hennen", email = "jay.hennen@noaa.gov" },
    { name = "Chris Barker", email = "chris.barker@noaa.gov" },
]
classifiers = [
    "Development Status ::  6 - Mature",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
]
dependencies = [
    "numpy >=2.5,<3",
]

dynamic = ["version"]


[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[project.urls]
Homepage = "https://github.com/NOAA-ORR-ERD"

[dependency-groups]
test = ["pytest"]
build = ["scikit-build-core", "cython", "numpy", "cython-cmake"]
dev = [{ include-group = "test" }, { include-group = "build"}, "build"]

[tool.scikit-build]
# when we get the stable ABI build working.
# wheel.py-api = "cp312"
# wheel.py-api = "py3"  # dont want to hardcode this -- scikit build can figure it out
# sdist.include = ["tests/unit_tests"]
build-dir = "build"
sdist.include = ["src/cell_tree2d/_version.py"]
# sdist.exclude = ["scripts",
#                  "tests/", # until we can figure out how to exclude the downloaded data files.
#                  "gnome/cy_gnome/*.cpp"
#                  ]

[tool.setuptools_scm]
# root = ".."
version_file = "src/cell_tree2d/_version.py"

[tool.cython-lint]
max-line-length = 100
ignore = ['E741']
# ignore = ['E503', 'E504']
# exclude = 'my_project/excluded_cython_file.pyx'

[tool.ruff.lint.extend-per-file-ignores]
# Ignore F841 Local variable is assigned to but never used in test files
"test_*.py" = ["F841"]
